name: R-CMD-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: none
      - name: Build
        shell: bash
        run: R CMD build . --no-build-vignettes --no-manual
      - name: Check
        shell: bash
        run: |
          R CMD check causalmiss_*.tar.gz --no-manual
          grep -q '^Status:' causalmiss.Rcheck/00check.log
          if grep -Eq '^Status:.*(ERROR|WARNING)' causalmiss.Rcheck/00check.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}
          path: causalmiss.Rcheck
